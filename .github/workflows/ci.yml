# Intégration continue de Weeb.
# À chaque push sur main/develop et à chaque pull request, GitHub vérifie
# que le backend, le frontend et l'image Docker sont fonctionnels.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Si on repousse sur la même branche, l'exécution précédente est annulée :
# inutile de consommer des ressources pour un code déjà dépassé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - tests
    runs-on: ubuntu-latest
    # Même base de données qu'en production, pour tester en conditions réelles.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: weeb
          POSTGRES_USER: weeb
          POSTGRES_PASSWORD: weeb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weeb"
          --health-interval 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://weeb:weeb@localhost:5432/weeb
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installation des dépendances
        run: pip install -r requirements.txt coverage

      - name: Vérification de la configuration Django
        run: python manage.py check

      - name: Migrations manquantes
        run: python manage.py makemigrations --check --dry-run

      - name: Tests + couverture
        run: |
          coverage run --source=apps,weeb_api manage.py test
          coverage report

  frontend:
    name: Frontend - lint et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker - build et démarrage
    runs-on: ubuntu-latest
    # On ne construit l'image que si les tests du backend sont passés.
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t weeb-backend ./backend

      - name: Démarrage du conteneur et vérification de la route de santé
        run: |
          docker run -d --name weeb -p 8000:8000 weeb-backend
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8000/api/health/; then exit 0; fi
            sleep 2
          done
          docker logs weeb
          exit 1
