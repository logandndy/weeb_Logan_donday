# Pipeline CI/CD de Weeb.
# À chaque push sur main/develop et à chaque pull request, GitHub vérifie
# que le backend, le frontend et l'image Docker sont fonctionnels, puis que
# les parcours utilisateur passent de bout en bout dans un vrai navigateur.
# Sur main uniquement, si tout est vert, l'application est déployée.
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:

# Si on repousse sur la même branche, l'exécution précédente est annulée :
# inutile de consommer des ressources pour un code déjà dépassé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - tests
    runs-on: ubuntu-latest
    # Même base de données qu'en production, pour tester en conditions réelles.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: weeb
          POSTGRES_USER: weeb
          POSTGRES_PASSWORD: weeb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weeb"
          --health-interval 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://weeb:weeb@localhost:5432/weeb
      # Les tests appellent l'API en HTTP : en mode production, Django les
      # redirigerait vers HTTPS. La config de prod est vérifiée à part (check --deploy).
      DEBUG: "True"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installation des dépendances
        run: pip install -r requirements.txt coverage

      - name: Vérification de la configuration Django
        run: python manage.py check

      - name: Vérification de la configuration de production
        env:
          DEBUG: "False"
          SECRET_KEY: ${{ github.run_id }}-cle-de-ci-uniquement-pour-check-deploy-0123456789
        run: python manage.py check --deploy --fail-level WARNING

      - name: Migrations manquantes
        run: python manage.py makemigrations --check --dry-run

      # Deux étapes séparées : dans GitHub, on voit tout de suite si c'est une
      # brique isolée (unitaire) ou l'assemblage HTTP + base (intégration) qui
      # casse. Chaque classe de test porte donc un tag "unit" ou "integration".
      # Les dossiers tests/ et migrations/ sont exclus de la couverture : on
      # mesure le code de l'application, pas les tests eux-mêmes.
      - name: Tests unitaires
        run: coverage run --source=apps,weeb_api --omit="*/tests/*,*/migrations/*" manage.py test --tag unit

      - name: Tests d'intégration
        run: coverage run --append --source=apps,weeb_api --omit="*/tests/*,*/migrations/*" manage.py test --tag integration

      - name: Rapport de couverture
        run: coverage report

  frontend:
    name: Frontend - lint, tests et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests + couverture
        run: npm run test:coverage

      - name: Build
        run: npm run build

  docker:
    name: Docker - build et démarrage
    runs-on: ubuntu-latest
    # On ne construit l'image que si les tests du backend sont passés.
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t weeb-backend ./backend

      - name: Démarrage du conteneur et vérification de la route de santé
        run: |
          docker run -d --name weeb -p 8000:8000 -e SECRET_KEY=cle-de-ci-uniquement weeb-backend
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8000/api/health/; then exit 0; fi
            sleep 2
          done
          docker logs weeb
          exit 1

  e2e:
    name: E2E - parcours utilisateur (Playwright)
    runs-on: ubuntu-latest
    # Les parcours complets sont les tests les plus lents : inutile de les
    # lancer si les tests backend ou frontend échouent déjà.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Playwright démarre lui-même l'API Django (base SQLite dédiée, recréée
      # à chaque run) et le frontend Vite : il faut donc Python et Node.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installation des dépendances du backend
        run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Installation des dépendances du frontend
        working-directory: frontend
        run: npm ci

      - name: Installation de Playwright et de Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Parcours E2E
        working-directory: e2e
        run: npx playwright test

      # En cas d'échec, le rapport HTML (captures d'écran, traces) est
      # téléchargeable depuis la page de l'exécution pour comprendre ce qui a cassé.
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  deploy:
    name: Déploiement en production
    runs-on: ubuntu-latest
    # Les tests conditionnent la mise en ligne : les 4 jobs doivent être verts.
    needs: [backend, frontend, docker, e2e]
    # Uniquement pour un push sur main (pas pour les PR ni pour develop).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://weeb-logan-donday.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Backend - déclenchement du déploiement Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" > /dev/null

      - name: Frontend - déploiement Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Smoke test - la nouvelle version de l'API est en ligne
        run: |
          # Le build Render prend quelques minutes : on attend jusqu'à 15 min
          # que l'API réponde avec le commit qu'on vient de déployer.
          for i in $(seq 1 90); do
            version=$(curl -fs https://weeb-api-tjw9.onrender.com/api/health/ | jq -r .version || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "API en ligne en version $version"
              exit 0
            fi
            sleep 10
          done
          echo "La nouvelle version n'est pas en ligne après 15 min (version actuelle : $version)"
          exit 1

      - name: Smoke test - le frontend répond
        run: curl -fsS -o /dev/null https://weeb-logan-donday.vercel.app/
