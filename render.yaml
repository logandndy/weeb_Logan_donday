# Infrastructure du backend décrite en code (Render Blueprint).
# Render lit ce fichier pour créer et configurer le service automatiquement.
services:
  - type: web
    name: weeb-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: frankfurt          # même région que la base Neon
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true    # clé aléatoire générée par Render, jamais dans Git
      - key: ALLOWED_HOSTS
        value: localhost
      - key: DATABASE_URL
        sync: false            # secret saisi à la main dans le dashboard (URL Neon)
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # URL du front Vercel
      - key: FRONTEND_URL
        sync: false            # URL du front Vercel
